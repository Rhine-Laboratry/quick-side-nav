name: Chrome Web Store deploy

on:
  push:
    branches:
      - "v*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit the uploaded package for Chrome Web Store review"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Package and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release branch and manifest version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          if [[ ! "$branch" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Release deployments must run from a v<major>.<minor> branch such as v1.2. Current branch: $branch" >&2
            exit 1
          fi

          version="$(node -p "require('./manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "manifest.json version must be a Chrome extension version such as 1.2.3. Found: $version" >&2
            exit 1
          fi

          IFS='.' read -r major minor _ <<< "$version"
          expected_branch="v${major}.${minor}"
          if [[ "$branch" != "$expected_branch" ]]; then
            echo "Release branch and manifest version do not match. Branch: $branch, manifest version: $version, expected branch: $expected_branch" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_file=dist/quick-side-nav-v${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest ok')"
          node --check background.js
          node --check content.js
          node --check popup.js
          node --check options.js

      - name: Run extension tests
        shell: bash
        run: node --test tests/*.test.js

      - name: Build extension ZIP
        shell: pwsh
        run: ./scripts/package-extension.ps1 -OutputDirectory dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: ${{ steps.release.outputs.package_file }}
          if-no-files-found: error

      - name: Verify Chrome Web Store secrets
        shell: bash
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Request Chrome Web Store access token
        id: token
        shell: bash
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          response="$(
            curl -sS --fail-with-body -X POST "https://oauth2.googleapis.com/token" \
              --data-urlencode "client_id=${CWS_CLIENT_ID}" \
              --data-urlencode "client_secret=${CWS_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${CWS_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"

          access_token="$(
            node -e '
              let body = "";
              process.stdin.on("data", chunk => body += chunk);
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (!parsed.access_token) {
                  console.error(body);
                  process.exit(1);
                }
                process.stdout.write(parsed.access_token);
              });
            ' <<< "$response"
          )"

          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Upload package to Chrome Web Store
        shell: bash
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          EXTENSION_VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_FILE: ${{ steps.release.outputs.package_file }}
        run: |
          set -euo pipefail

          if [[ ! -f "$PACKAGE_FILE" ]]; then
            echo "Expected package file was not created: $PACKAGE_FILE" >&2
            exit 1
          fi

          upload_response="$(
            curl -sS --fail-with-body \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/zip" \
              -X POST \
              -T "$PACKAGE_FILE" \
              "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:upload"
          )" || {
            echo "Chrome Web Store upload request failed. Response: ${upload_response:-<empty>}" >&2
            exit 1
          }

          upload_state="$(
            node -e '
              let body = "";
              process.stdin.on("data", chunk => body += chunk);
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.uploadState !== "string") {
                  console.error(body);
                  process.exit(1);
                }
                process.stdout.write(parsed.uploadState);
              });
            ' <<< "$upload_response"
          )" || {
            echo "Chrome Web Store upload returned an invalid response: $upload_response" >&2
            exit 1
          }

          if [[ "$upload_state" == "SUCCEEDED" ]]; then
            uploaded_version="$(
              node -e '
                let body = "";
                process.stdin.on("data", chunk => body += chunk);
                process.stdin.on("end", () => {
                  const parsed = JSON.parse(body);
                  process.stdout.write(parsed.crxVersion || "");
                });
              ' <<< "$upload_response"
            )"

            if [[ -n "$uploaded_version" && "$uploaded_version" != "$EXTENSION_VERSION" ]]; then
              echo "Chrome Web Store accepted unexpected version $uploaded_version; expected $EXTENSION_VERSION. Response: $upload_response" >&2
              exit 1
            fi

            echo "Chrome Web Store upload succeeded for version $EXTENSION_VERSION."
            exit 0
          fi

          if [[ "$upload_state" != "IN_PROGRESS" && "$upload_state" != "UPLOAD_IN_PROGRESS" ]]; then
            echo "Chrome Web Store upload did not succeed. State: $upload_state. Response: $upload_response" >&2
            exit 1
          fi

          status_response="$upload_response"
          for attempt in {1..30}; do
            sleep 10
            status_response="$(
              curl -sS --fail-with-body \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus"
            )" || {
              echo "Chrome Web Store status request failed on attempt $attempt. Response: ${status_response:-<empty>}" >&2
              exit 1
            }

            upload_state="$(
              node -e '
                let body = "";
                process.stdin.on("data", chunk => body += chunk);
                process.stdin.on("end", () => {
                  const parsed = JSON.parse(body);
                  if (typeof parsed.lastAsyncUploadState !== "string") {
                    console.error(body);
                    process.exit(1);
                  }
                  process.stdout.write(parsed.lastAsyncUploadState);
                });
              ' <<< "$status_response"
            )" || {
              echo "Chrome Web Store status returned an invalid response: $status_response" >&2
              exit 1
            }

            case "$upload_state" in
              SUCCEEDED)
                echo "Chrome Web Store upload succeeded for version $EXTENSION_VERSION after $attempt status check(s)."
                exit 0
                ;;
              IN_PROGRESS|UPLOAD_IN_PROGRESS)
                echo "Chrome Web Store upload is still in progress (attempt $attempt of 30)."
                ;;
              *)
                echo "Chrome Web Store upload failed. State: $upload_state. Response: $status_response" >&2
                exit 1
                ;;
            esac
          done

          echo "Chrome Web Store upload did not finish after 30 status checks. Last response: $status_response" >&2
          exit 1

      - name: Submit for Chrome Web Store review
        shell: bash
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${PUBLISH_INPUT}" != "true" ]]; then
            echo "Package uploaded. Skipping publish because workflow_dispatch publish=false."
            exit 0
          fi

          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:publish"
