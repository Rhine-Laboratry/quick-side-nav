<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Side Nav</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Quick Side Nav</h1>
      </header>

      <label class="switchRow">
        <span>
          <span class="switchTitle">サイドボタン監視</span>
          <span id="switchState" class="switchState">OFF</span>
        </span>
        <input id="enabledToggle" class="switchInput" type="checkbox" role="switch">
      </label>

      <section class="target" aria-label="現在の移動先">
        <span class="label">現在の移動先</span>
        <p id="targetUrl" class="url">https://chatgpt.com/</p>
      </section>

      <div class="actions">
        <button id="openButton" type="button">このURLを開く</button>
        <button id="optionsButton" class="secondary" type="button">設定を開く</button>
      </div>

      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
