<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Side Nav</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Quick Side Nav</h1>
      </header>

      <label class="switchRow">
        <span>
          <span class="switchTitle">入力監視</span>
          <span id="switchState" class="switchState">OFF</span>
          <span id="switchHint" class="switchHint">登録済みの入力は反応しません。</span>
        </span>
        <input id="enabledToggle" class="switchInput" type="checkbox" role="switch" aria-describedby="switchHint">
      </label>

      <section class="target" aria-label="登録ルール">
        <span class="label">登録ルール</span>
        <div id="rulesList" class="ruleList"></div>
      </section>

      <div class="actions">
        <button id="optionsButton" class="secondary" type="button">設定を開く</button>
      </div>

      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
