<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionName">Quick Side Nav</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Quick Side Nav</h1>
      </header>

      <label class="switchRow">
        <span>
          <span class="switchTitle" data-i18n="monitoringLabel">Input monitoring</span>
          <span id="switchState" class="switchState">OFF</span>
          <span id="switchHint" class="switchHint" data-i18n="monitoringOffHint">Saved triggers are inactive.</span>
        </span>
        <input id="enabledToggle" class="switchInput" type="checkbox" role="switch" aria-describedby="switchHint">
      </label>

      <section class="target" aria-label="Saved rules" data-i18n-aria-label="savedRulesLabel">
        <span class="label" data-i18n="savedRulesLabel">Saved rules</span>
        <div id="rulesList" class="ruleList"></div>
      </section>

      <div class="actions">
        <button id="optionsButton" class="secondary" type="button" data-i18n="openSettingsButton">Open settings</button>
      </div>

      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
