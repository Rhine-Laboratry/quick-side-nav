<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Side Nav 設定</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="page">
      <h1>Quick Side Nav 設定</h1>
      <p class="description">
        通常Webページ上でマウスのサイドボタンを押すと、この拡張機能が現在のタブを下記URLへ移動します。
        Chrome内部ページやアドレスバー上では動作しません。
      </p>

      <form id="settingsForm" class="form" novalidate>
        <label class="field">
          <span class="label">移動先URL</span>
          <input id="targetUrl" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://chatgpt.com/">
        </label>

        <div class="actions">
          <button type="submit">保存</button>
          <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section class="notes" aria-label="使い方">
        <h2>使い方</h2>
        <p>拡張機能アイコンから「サイドボタン監視」をONにしてください。通常Webページ上でサイドボタンを押すと登録URLへ移動します。</p>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
